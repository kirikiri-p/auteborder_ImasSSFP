<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>シャニソン ボーダー速報</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Raleway:wght@300;500;600&family=Noto+Serif+JP:wght@700&display=swap">
<style>
/* ハミング (Fontworks) is used where it is installed; it is not served from here. */
@font-face{font-family:"Humming B";src:local("FOT-HummingStd-B"),local("FOT-ハミング Std B"),local("FOT-Humming Std B"),local("HummingStd-B"),local("ハミング Std B"),local("Humming Std B"),local("A-OTF-HummingStd-B")}
:root{
  color-scheme:light;
  --ink:#002841; --ink-2:#45709e; --ink-3:#7e98b4; --rule:rgba(0,40,65,.13);
  --paper:rgba(255,255,255,.86); --solid:#fff; --field:#f3f9fd;
  --prism:linear-gradient(to right,#b4e6fa 0,#f1deff 25%,#f5bde5 50%,#f1deff 75%,#b4e6fa 100%);
  --no:#cf3f63; --no-bg:#fff0f4; --plan:#45709e; --ok:#1f9a8a; --ok-bg:#effaf8; --wait:#a9bacb;
  --s1:#2f6fc0; --s2:#e2708c; --s3:#2a9d8f;
  --jp:"Humming B","FOT-ハミング Std B","ハミング Std B","Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --en:"Raleway","Humming B","Zen Maru Gothic",sans-serif;
  --serif:"Noto Serif JP","Hiragino Mincho ProN",serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font:15px/1.65 var(--jp);font-variant-numeric:lining-nums;font-synthesis:none;background:#cdeaf8}
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(ellipse 55% 22% at 18% 26%,rgba(255,255,255,.6),transparent 70%),
    radial-gradient(ellipse 45% 18% at 88% 52%,rgba(255,255,255,.5),transparent 70%),
    radial-gradient(ellipse 60% 20% at 30% 84%,rgba(255,255,255,.55),transparent 70%),
    linear-gradient(180deg,#5db6e5 0%,#8fcdef 32%,#c4e7f8 70%,#e9f6fd 100%)}
.n{font-variant-numeric:lining-nums tabular-nums;letter-spacing:.01em}
.in{max-width:920px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}

/* header */
.hero{padding:26px 0 8px}
.hero .row{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.hero h1{margin:0;line-height:1}
.hero h1 b{display:block;font:300 2.4rem/1 var(--en);letter-spacing:.14em;text-transform:uppercase;
  background:linear-gradient(180deg,#002841,#45709e);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero h1 small{display:block;margin-top:8px;font:700 .72rem/1.4 var(--serif);letter-spacing:.32em;color:var(--ink-2)}
button{font-family:inherit}
.refresh,.mini,.use,.close{font-size:.8rem;color:var(--ink);background:var(--prism);border:1px solid rgba(255,255,255,.6);padding:6px 16px;cursor:pointer;white-space:nowrap;letter-spacing:.08em}
.refresh:focus-visible,.card:focus-visible,button:focus-visible{outline:2px solid var(--ink-2);outline-offset:2px}
.sumline{margin:18px 0 0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--paper)}
.sumline div{display:flex;flex-direction:column;padding:9px 12px;border-left:1px solid var(--rule)}
.sumline div:first-child{border-left:none}
.sumline .k{font-size:.7rem;color:var(--ink-2);letter-spacing:.06em}
.sumline .v{font-size:1.4rem;line-height:1.2}
.sumline .v small{font-size:.75rem;margin-left:2px}
@media (max-width:460px){.sumline{grid-template-columns:repeat(2,1fr)}.sumline div:nth-child(odd){border-left:none}.sumline div:nth-child(n+3){border-top:1px solid var(--rule)}.sumline div:last-child{grid-column:1/-1}}
.updated{margin:8px 0 0;font-size:.74rem;color:var(--ink-2);text-align:right}

main.in{display:flex;flex-direction:column;gap:26px;padding-top:14px;padding-bottom:48px}
.notice{padding:9px 14px;font-size:.84rem;background:var(--paper)}
.notice.warn{color:var(--no);border-left:3px solid var(--no)}

/* units */
.unit{--u:#888;display:flex;flex-direction:column;gap:8px}
.ribbon{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 12px;padding-bottom:5px;border-bottom:2px solid var(--u)}
.ribbon b{font:500 1.15rem/1.2 var(--en);letter-spacing:.1em;color:var(--ink)}
.ribbon span{font:700 .66rem/1.4 var(--serif);letter-spacing:.24em;color:var(--ink-2)}
.ribbon .alert{font:700 .7rem/1.4 var(--jp);letter-spacing:.04em;color:#fff;background:var(--no);padding:1px 8px}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}

/* cards */
.card{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:grid;grid-template-columns:1fr;align-items:center;gap:1px 8px;
  background:var(--paper);padding:9px 10px 9px 14px;min-width:0;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--wait)}
.card.no{background:var(--no-bg)} .card.no::before{background:var(--no)}
.card.plan::before{background:var(--plan)}
.card.ok{background:var(--ok-bg)} .card.ok::before{background:var(--ok)}
.card.off{opacity:.5}
.card.top{grid-template-columns:1fr auto;grid-column:span 2;padding:12px 14px 12px 18px;background:rgba(255,255,255,.93)}
.card.top::before{width:5px}
.card.top.no{background:var(--no-bg)} .card.top.ok{background:var(--ok-bg)}
.who{display:flex;align-items:center;gap:7px;min-width:0}
.line2{grid-column:1;display:flex;justify-content:space-between;align-items:center;gap:6px}
.who b{font-weight:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.top .who b{font-size:1.12rem}
.rank{font-size:.68rem;line-height:1.5;letter-spacing:.04em;padding:0 6px;white-space:nowrap;border:1px solid var(--ink-3);color:var(--ink-2)}
.card.top .rank{background:var(--ink);border-color:var(--ink);color:#fff}
.state{font-size:.72rem;white-space:nowrap;letter-spacing:.04em}
.state.no{color:var(--no)} .state.plan{color:var(--plan)} .state.ok{color:var(--ok)} .state.na,.state.off{color:var(--ink-3)}
.fig{grid-column:1;font-size:1.15rem;line-height:1.3}
.card.top .fig{font-size:1.55rem}
.fig .k{font-family:var(--jp);font-size:.7rem;font-weight:normal;color:var(--ink-2);margin-right:4px;letter-spacing:0}
.aux{grid-column:1;font-size:.72rem;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aux .up{color:var(--no)} .aux .down{color:var(--ok)}
.face{flex:none;width:30px;height:30px;font-size:.88rem;border-radius:50%;position:relative;overflow:hidden;
  background:color-mix(in srgb,var(--u) 16%,#fff);border:1.5px solid var(--u);display:grid;place-items:center;color:var(--u)}
.card.top .face{grid-column:2;grid-row:1/span 4;width:76px;height:76px;font-size:1.8rem;border-width:2px}
.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 12%}

/* panels */
details.box{background:var(--paper);padding:12px 16px}
details.box>summary{cursor:pointer;font-size:.92rem;letter-spacing:.06em}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.form label,.busy{display:flex;flex-direction:column;gap:3px;font-size:.74rem;color:var(--ink-2)}
.busy{margin-top:12px}
input,select,textarea{font:inherit;font-size:.9rem;color:var(--ink);background:var(--field);border:1px solid var(--rule);border-radius:0;padding:6px 9px}
.busy textarea{resize:vertical}
ol{margin:6px 0 0;padding-left:1.4em;font-size:.9rem}
.note{font-size:.74rem;color:var(--ink-2);margin:6px 0 0;line-height:1.7}
.steps{margin:8px 0 0;padding-left:1.3em;font-size:.82rem}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
a.mini{text-decoration:none;display:inline-block}
#importText{width:100%;margin-top:10px;font-size:.8rem;resize:vertical}
.foot{font-size:.72rem;color:var(--ink-2);text-align:center;letter-spacing:.06em}
.sub{font:700 .68rem/1.4 var(--serif);letter-spacing:.24em;color:var(--ink-2);margin:18px 0 0}
.songhead,.songrow{display:grid;grid-template-columns:minmax(0,1fr) 4.6em 6.6em auto;gap:6px;align-items:center}
.songhead{font-size:.7rem;color:var(--ink-2);margin-top:10px}
.songrow{margin-top:6px}
.songrow input{min-width:0;width:100%}
.songrow input[data-f=len],.songrow input[data-f=fans]{text-align:right}
.mini{font-size:.74rem;padding:3px 12px}
.mini:disabled{opacity:.35;cursor:default}
@media (max-width:560px){
  .songhead,.songrow{grid-template-columns:4.6em 6.6em 1fr}
  .songhead span:first-child{display:none}
  .songrow{border-top:1px solid var(--rule);padding-top:8px;margin-top:8px}
  .songrow input[data-f=name]{grid-column:1/-1}
  .songrow .mini{justify-self:end}
}
table.pick{border-collapse:collapse;width:100%;margin-top:8px;font-size:.8rem;table-layout:fixed}
table.pick th,table.pick td{padding:3px 2px;border-bottom:1px solid var(--rule)}
table.pick thead th{font-size:.7rem;color:var(--ink-2);font-weight:normal;text-align:left}
table.pick tbody th{text-align:left;font-weight:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--u,#888);padding-left:6px}
table.pick col.nm{width:5.2em}
table.pick select,.songpick select{width:100%;min-width:0;font-size:.78rem;padding:4px 5px;text-overflow:ellipsis}
table.pick select.set{border-color:var(--ink-2);background:#e6f0fa}
.songpick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.songpick label{display:flex;flex-direction:column;gap:3px;font-size:.72rem;color:var(--ink-2);min-width:0}
@media (max-width:460px){.songpick{grid-template-columns:1fr}}
.split{font-size:.82rem;color:var(--ink-2);margin:0;line-height:1.8}
.split b{color:var(--ink);font-weight:normal}

/* detail sheet */
dialog{border:none;padding:0;background:var(--solid);color:var(--ink);width:min(640px,100%);max-height:92vh;margin:auto}
@media (max-width:640px){dialog{margin:auto 0 0;max-width:100%}}
dialog::backdrop{background:rgba(0,40,65,.45)}
.sheet{display:flex;flex-direction:column}
.sheet-top{--u:#888;background:linear-gradient(120deg,var(--u),color-mix(in srgb,var(--u) 50%,#fff));color:#fff;padding:16px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.sheet-top .face{width:64px;height:64px;border-color:#fff;background:rgba(255,255,255,.25);color:#fff;font-size:1.6rem}
.sheet-top h3{margin:0;font-size:1.3rem;font-weight:normal;line-height:1.25;letter-spacing:.06em}
.sheet-top h3 small{display:block;font:500 .8rem/1.4 var(--en);letter-spacing:.12em;opacity:.95}
.close{background:#fff;border:none}
.sheet-body{padding:14px 16px max(20px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--ink)}
.seg button{font-size:.8rem;border:none;padding:4px 12px;background:transparent;color:var(--ink);cursor:pointer;letter-spacing:.04em}
.seg button.on{background:var(--ink);color:#fff}
.seg-rank{align-self:flex-start;flex-wrap:wrap}
.seg-rank button{padding:4px 10px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 14px}
@media (max-width:460px){.facts{grid-template-columns:repeat(2,1fr)}}
.facts div{display:flex;flex-direction:column;border-bottom:1px solid var(--rule);padding-bottom:4px}
.facts .k{font-size:.7rem;color:var(--ink-2)}
.facts .v{font-size:1.15rem}
.facts .v.safe{color:var(--no)}
.myrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.9rem}
.meas{font-size:.8rem;color:var(--ink-2)}
.use{font-size:.74rem;padding:1px 10px;margin-left:4px}
.myrow input{width:9.5em;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.74rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:18px;height:0;border-top:2.5px solid currentColor}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chart text{fill:var(--ink-2);font-size:10px;font-family:var(--jp)}
.tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--rule);padding:5px 9px;font-size:.76rem;white-space:nowrap;display:none}
table.cmp{border-collapse:collapse;width:100%;font-size:.86rem}
table.cmp th,table.cmp td{padding:6px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
table.cmp th{font-size:.7rem;color:var(--ink-2);font-weight:normal}
table.cmp th:first-child,table.cmp td:first-child{text-align:left}
td.up{color:var(--no)} td.down{color:var(--ok)}
table.ranks tbody tr{cursor:pointer}
td.crossed{color:var(--ink-3)}
table.ranks tr.on td{background:#e6f0fa}
table.ov{margin-top:8px}
table.ov tbody tr{cursor:pointer}
table.ov td:first-child{border-left:3px solid var(--u,#888);padding-left:8px}
@media (prefers-reduced-motion:no-preference){dialog[open]{animation:rise .22s ease-out}@keyframes rise{from{transform:translateY(24px);opacity:.4}}}
</style>
</head>
<body>
<header class="hero">
  <div class="in">
    <div class="row">
      <h1><b>Border</b><small id="eventLine">読み込み中</small></h1>
      <button class="refresh" id="reload" type="button">更新</button>
    </div>
    <div class="sumline" id="stats"></div>
    <p class="updated" id="updated"></p>
  </div>
</header>

<main class="in">
  <div id="notice"></div>
  <div id="units" style="display:flex;flex-direction:column;gap:26px"></div>

  <details class="box" id="ovBox">
    <summary>順位ごとの予測</summary>
    <div class="seg seg-rank" id="ovSeg" role="group" aria-label="順位" style="margin-top:10px"></div>
    <table class="cmp ov"><thead><tr><th></th><th>今</th><th>予測最終</th><th>前回最終</th></tr></thead><tbody id="ovBody"></tbody></table>
    <p class="note" id="ovNote"></p>
  </details>
  <details class="box">
    <summary>今日の配分</summary>
    <div id="today"></div>
  </details>
  <details class="box">
    <summary>設定</summary>
    <div class="form">
      <label>安全ラインの基準
        <select id="basis">
          <option value="max">過去でいちばん伸びた例</option>
          <option value="p90">上位10%の伸び</option>
          <option value="median">中央値</option>
        </select>
      </label>
      <label>上乗せ（%）<input id="margin" inputmode="decimal"></label>
      <label>判定の基準
        <select id="judge">
          <option value="stage">予測を超えたら安全ライン</option>
          <option value="pred">予測</option>
          <option value="safe">安全ライン</option>
        </select>
      </label>
      <label>曲と曲のあいだ（秒）<input id="gap" inputmode="numeric"></label>
      <label>休み7時間の開始
        <select id="restStart"></select>
      </label>
      <label>今日の残りスキップ<input id="skipLeft" inputmode="numeric"></label>
      <label>今日の残りオート<input id="autoLeft" inputmode="numeric"></label>
    </div>
    <label class="busy">遊べない予定<textarea id="busy" rows="3" placeholder="2026-11-05 18:00-21:00"></textarea></label>
  </details>
  <details class="box">
    <summary>曲</summary>
    <div class="songhead"><span>曲名</span><span>長さ</span><span>1回の人数</span><span></span></div>
    <div id="songList"></div>
    <p style="margin:10px 0 0"><button type="button" class="mini" id="addSong">曲を足す</button></p>
    <p class="sub">ふだんの曲</p>
    <div class="songpick" id="defPick"></div>
    <p class="note" id="rateNote"></p>
    <p class="sub">アイドルごとの曲</p>
    <table class="pick"><colgroup><col class="nm"><col><col><col></colgroup>
      <thead><tr><th></th><th>手動</th><th>オート</th><th>スキップ</th></tr></thead><tbody id="pickBody"></tbody></table>
  </details>
  <details class="box" id="importBox">
    <summary>取り込み</summary>
    <ol class="steps">
      <li>PCのブラウザでDiscordの「シャニソンボーダー」を開く</li>
      <li>下の「ボーダーを読む」をブックマークバーに入れて押す（動かなければ「コードをコピー」して、開発者ツールのコンソールに貼る）</li>
      <li>出てきた「コピー」を押して、ここに貼る</li>
    </ol>
    <p class="tools"><a class="mini" id="bmLink" href="#">ボーダーを読む</a><button type="button" class="mini" id="copyCode">コードをコピー</button></p>
    <textarea id="importText" rows="3" placeholder="ここに貼る（Botの投稿をそのままコピーしたものでも読めます）"></textarea>
    <p class="tools"><button type="button" class="mini" id="doImport">取り込む</button><button type="button" class="mini" id="clearImport">取り込んだ記録を消す</button></p>
    <p class="note" id="importMsg"></p>
  </details>
  <p class="foot">非公式のファンツールです</p>
</main>

<dialog id="sheet" aria-labelledby="sheetTitle"><div class="sheet" id="sheetBody"></div></dialog>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const UNITS = [
    { name: "illumination STARS", kana: "イルミネーションスターズ", color: "#d99a17", text: "#1e2a46", members: ["櫻木真乃", "風野灯織", "八宮めぐる"] },
    { name: "L'Antica", kana: "アンティーカ", color: "#7d54b8", members: ["月岡恋鐘", "田中摩美々", "白瀬咲耶", "三峰結華", "幽谷霧子"] },
    { name: "放課後クライマックスガールズ", kana: "放クラ", color: "#e7701c", members: ["小宮果穂", "園田智代子", "西城樹里", "杜野凛世", "有栖川夏葉"] },
    { name: "ALSTROEMERIA", kana: "アルストロメリア", color: "#e06b95", members: ["大崎甘奈", "大崎甜花", "桑山千雪"] },
    { name: "Straylight", kana: "ストレイライト", color: "#c8364b", members: ["芹沢あさひ", "黛冬優子", "和泉愛依"] },
    { name: "noctchill", kana: "ノクチル", color: "#2b97a6", members: ["浅倉透", "樋口円香", "福丸小糸", "市川雛菜"] },
    { name: "SHHis", kana: "シーズ", color: "#4167b5", members: ["七草にちか", "緋田美琴"] },
    { name: "CoMETIK", kana: "コメティック", color: "#4f4a7a", members: ["斑鳩ルカ", "鈴木羽那", "郁田はるき"] },
  ];
  const IDOLS = UNITS.flatMap(u => u.members);
  const UNIT_OF = Object.fromEntries(UNITS.flatMap(u => u.members.map(m => [m, u])));
  const GIVEN = { "櫻木真乃": "真乃", "風野灯織": "灯織", "八宮めぐる": "めぐる", "月岡恋鐘": "恋鐘", "田中摩美々": "摩美々", "白瀬咲耶": "咲耶", "三峰結華": "結華", "幽谷霧子": "霧子", "小宮果穂": "果穂", "園田智代子": "智代子", "西城樹里": "樹里", "杜野凛世": "凛世", "有栖川夏葉": "夏葉", "大崎甘奈": "甘奈", "大崎甜花": "甜花", "桑山千雪": "千雪", "芹沢あさひ": "あさひ", "黛冬優子": "冬優子", "和泉愛依": "愛依", "浅倉透": "透", "樋口円香": "円香", "福丸小糸": "小糸", "市川雛菜": "雛菜", "七草にちか": "にちか", "緋田美琴": "美琴", "斑鳩ルカ": "ルカ", "鈴木羽那": "羽那", "郁田はるき": "はるき" };
  const TOP100 = ["幽谷霧子", "和泉愛依", "小宮果穂", "大崎甘奈", "八宮めぐる", "市川雛菜", "緋田美琴", "郁田はるき"];

  let geo = null;
  function chartSvg(r) {
    const W = 340, H = 200, L = 38, R = 12, T = 8, B = 20;
    const past = (ref ? ref.events : []).map(e => {
      const arr = (((ref.past[r.name] || {})[e.key]) || {})[r.rk];
      return arr ? arr.map((v, x) => v == null ? null : [x, v]).filter(Boolean) : [];
    });
    const cur = r.pts.map(p => [p[0], p[1]]);
    const band = [];
    if (ref && r.border > 0 && !r.final) {
      const curves = ref.refs.filter(x => x.rank === r.rk);
      const xs = [r.pct]; for (let x = Math.floor(r.pct) + 1; x <= 100; x++) xs.push(x);
      for (const x of xs) {
        // each past curve projects: border now x (its ratio to final now) / (its ratio to final at x)
        const vs = curves.map(c => { const a = ratioAt(c.curve, r.pct), b = ratioAt(c.curve, x); return a && b ? r.border * a / b : null; }).filter(v => v != null);
        if (vs.length) band.push([x, Math.min(...vs), q(vs, .5), Math.max(...vs)]);
      }
    }
    const ys = [...cur, ...past.flat()].map(p => p[1]).concat(band.map(b => b[3]), [r.safe, r.my].filter(v => v));
    const y1 = (ys.length ? Math.max(...ys) : 1) * 1.06;
    const sx = x => L + x / 100 * (W - L - R), sy = y => H - B - y / y1 * (H - T - B);
    geo = { W, L, R, sx, cur, past, band };
    const path = pts => pts.map((p, i) => (i ? "L" : "M") + sx(p[0]).toFixed(1) + "," + sy(p[1]).toFixed(1)).join("");
    let s = "";
    const step = niceStep(y1 / 4);
    for (let y = 0; y <= y1; y += step) s += `<line x1="${L}" x2="${W - R}" y1="${sy(y)}" y2="${sy(y)}" stroke="var(--rule)"/><text x="${L - 4}" y="${sy(y) + 3}" text-anchor="end">${!y ? 0 : y >= 1e8 ? +(y / 1e8).toFixed(1) + "億" : Math.round(y / 1e4) + "万"}</text>`;
    for (const x of [0, 25, 50, 75, 100]) s += `<text x="${sx(x)}" y="${H - 6}" text-anchor="${x === 100 ? "end" : x === 0 ? "start" : "middle"}">${x}%</text>`;
    if (band.length > 1) {
      s += `<path d="${band.map((b, i) => (i ? "L" : "M") + sx(b[0]).toFixed(1) + "," + sy(b[3]).toFixed(1)).join("")}${[...band].reverse().map(b => "L" + sx(b[0]).toFixed(1) + "," + sy(b[1]).toFixed(1)).join("")}Z" fill="var(--s1)" opacity=".16"/>`;
      s += `<path d="${path(band.map(b => [b[0], b[2]]))}" fill="none" stroke="var(--s1)" stroke-width="1.5" stroke-dasharray="2 3"/>`;
    }
    if (past[1] && past[1].length) s += `<path d="${path(past[1])}" fill="none" stroke="var(--s3)" stroke-width="2" stroke-dasharray="1 3" stroke-linecap="round"/>`;
    if (past[0] && past[0].length) s += `<path d="${path(past[0])}" fill="none" stroke="var(--s2)" stroke-width="2" stroke-dasharray="5 3"/>`;
    if (r.safe) s += `<line x1="${L}" x2="${W - R}" y1="${sy(r.safe)}" y2="${sy(r.safe)}" stroke="var(--no)" stroke-width="1.2" stroke-dasharray="5 4"/><text x="${L + 3}" y="${sy(r.safe) - 3}" style="fill:var(--no)">安全 ${man(r.safe)}</text>`;
    if (r.my) s += `<line x1="${L}" x2="${W - R}" y1="${sy(r.my)}" y2="${sy(r.my)}" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="1 3"/><text x="${W - R - 3}" y="${sy(r.my) - 3}" text-anchor="end" style="fill:var(--ink)">自分 ${man(r.my)}</text>`;
    if (cur.length > 1) s += `<path d="${path(cur)}" fill="none" stroke="var(--s1)" stroke-width="2.4"/>`;
    if (cur.length) { const p = cur[cur.length - 1]; s += `<circle cx="${sx(p[0])}" cy="${sy(p[1])}" r="4" fill="var(--s1)" stroke="var(--paper)" stroke-width="2"/>`; }
    s += `<line id="xh" y1="${T}" y2="${H - B}" stroke="var(--ink-2)" stroke-width="1" visibility="hidden"/><rect id="hit" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/>`;
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(r.name)}の${rl(r.rk)}ボーダーの推移">${s}</svg>`;
  }
  function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))); const n = raw / p; return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * p; }
  function lerp(pts, x) { if (!pts.length || x < pts[0][0] || x > pts[pts.length - 1][0]) return null; for (let i = 1; i < pts.length; i++) if (pts[i][0] >= x) { const a = pts[i - 1], b = pts[i]; return b[0] > a[0] ? a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]) : b[1]; } return pts[pts.length - 1][1]; }
  function bindChart() {
    const svg = $("#chart svg"), hit = $("#hit"), xh = $("#xh"), tip = $("#tip"); if (!svg || !geo) return;
    const show = e => {

      const x = Math.max(0, Math.min(100, ((e.clientX - box.left) * k - geo.L) / (geo.W - geo.L - geo.R) * 100));
      xh.setAttribute("x1", geo.sx(x)); xh.setAttribute("x2", geo.sx(x)); xh.setAttribute("visibility", "visible");
      const lines = [];
      const c = lerp(geo.cur, x); if (c != null) lines.push(`<span style="color:var(--s1)">今回</span> <b class="n">${man(c)}</b>`);
      const b = lerp(geo.band.map(v => [v[0], v[2]]), x); if (c == null && b != null) lines.push(`<span style="color:var(--s1)">予測</span> <b class="n">${man(b)}</b>（${man(lerp(geo.band.map(v => [v[0], v[1]]), x))}〜${man(lerp(geo.band.map(v => [v[0], v[3]]), x))}）`);
      (ref ? ref.events : []).forEach((e, i) => { const v = lerp(geo.past[i] || [], x); if (v != null) lines.push(`<span style="color:var(--s${i + 2})">${esc(e.label)}</span> <b class="n">${man(v)}</b>`); });
      tip.innerHTML = `<div class="n">${x.toFixed(1)}%</div>` + lines.join("<br>");
      tip.style.display = "block";
      const px = geo.sx(x) / k, w = tip.offsetWidth;
      tip.style.left = Math.max(0, Math.min(box.width - w, px + 10 > box.width - w ? px - w - 10 : px + 10)) + "px"; tip.style.top = "6px";
    };
    const hide = () => { xh.setAttribute("visibility", "hidden"); tip.style.display = "none"; };
    hit.addEventListener("pointermove", show); hit.addEventListener("pointerdown", show);
    hit.addEventListener("pointerleave", hide); hit.addEventListener("pointercancel", hide);
  }

  // ---------- imports (pasted on this device) ----------
  const IKEY = "shanison-border-import";
  const RANKS5 = ["1", "12", "50", "100", "500", "10", "SS"];
  const loadImp = () => { try { return JSON.parse(localStorage.getItem(IKEY) || "{}") || {}; } catch (e) { return {}; } };
  const evKey = (a, b) => [a, b].map(x => x.replace(/[-:]/g, "").replace(" ", "-")).join("_");
  function mergeInto(base, add) {   // base and add are {eventKey: {title, start, end, idols: {name: [point...]}}}; returns the number of new points
    let n = 0;
    for (const [k, e] of Object.entries(add || {})) {
      if (!e || !e.idols || !e.start || !e.end) continue;
      const b = base[k] = base[k] || { title: e.title, start: e.start, end: e.end, idols: {} };
      for (const [name, pts] of Object.entries(e.idols)) {
        const rows = b.idols[name] = b.idols[name] || [];
        for (const p of pts || []) if (Array.isArray(p) && p[0] && !rows.some(q => q[0] === p[0])) { rows.push(p); n++; }
        rows.sort((x, y) => x[1] - y[1] || (x[0] < y[0] ? -1 : 1));
      }
    }
    return n;
  }
  const withImports = p => { const c = JSON.parse(JSON.stringify(p || {})); mergeInto(c, loadImp()); return c; };
  function parsePosts(text) {   // one or more border posts as plain text
    const out = {}; let s = null, pend = null;
    const flush = () => {
      if (!(s && s.start && s.now && Object.keys(s.vals).length && s.idol)) return;
      const e = out[evKey(s.start, s.end)] = out[evKey(s.start, s.end)] || { title: s.title, start: s.start, end: s.end, idols: {} };
      (e.idols[s.idol] = e.idols[s.idol] || []).push([s.now, s.pct, ...RANKS5.map(r => s.vals[r] ?? null)]);
    };
    for (const raw of String(text).split(/\r?\n/)) {
      const l = raw.trim(); if (!l) continue; let m;
      if ((m = l.match(/^(.+ライブイベント)\s*[\(（](.+)[\)）]\s*$/))) { flush(); s = { title: m[1].trim(), idol: m[2].trim(), vals: {} }; pend = null; continue; }
      if (!s) continue;
      if ((m = l.match(/開催期間[:：]\s*(\d{4}-\d{2}-\d{2} \d{2}:\d{2})\s*[~〜]\s*(\d{4}-\d{2}-\d{2} \d{2}:\d{2})/))) { s.start = m[1]; s.end = m[2]; continue; }
      if ((m = l.match(/現在時刻[:：]\s*(\d{4}-\d{2}-\d{2} \d{2}:\d{2})\s*[\(（]経過率\s*([\d.]+)%[\)）]/))) { s.now = m[1]; s.pct = +m[2]; continue; }
      if ((m = l.match(/^(?:🥇|🥈|🥉)?\s*(\d+)位\s*-/))) { pend = m[1]; continue; }
      if (l.includes("ランク - ")) { pend = l.startsWith("SSランク") ? "SS" : null; continue; }
      if ((m = l.match(/^([^:：\d]{1,12})[:：]\s*([\d,]+)/)) && pend != null) { s.vals[pend] = +m[2].replace(/,/g, ""); pend = null; }
    }
    flush();
    return out;
  }
  const impCount = () => Object.values(loadImp()).reduce((a, e) => a + Object.values(e.idols || {}).reduce((b, r) => b + r.length, 0), 0);
  const impMsg = t => { $("#importMsg").textContent = t ?? (impCount() ? `この端末に取り込んだ記録：${impCount()}件` : ""); };
  $("#doImport").addEventListener("click", () => {
    const t = $("#importText").value.trim(); if (!t) return;
    let add = null;
    try { add = JSON.parse(t); } catch (e) { add = parsePosts(t); }
    const n = mergeInto(JSON.parse(JSON.stringify(points || {})), add), all = loadImp(); mergeInto(all, add);
    try { localStorage.setItem(IKEY, JSON.stringify(all)); } catch (e) {}
    $("#importText").value = "";
    if (fetched) points = withImports(fetched);
    impMsg(n ? `${n}件取り込みました。` : "新しい記録はありませんでした。");
    render();
  });
  $("#clearImport").addEventListener("click", () => {
    try { localStorage.removeItem(IKEY); } catch (e) {}
    if (fetched) points = withImports(fetched);
    impMsg("取り込んだ記録を消しました。"); render();
  });
  let grabCode = "";
  fetch("grab.js", { cache: "no-store" }).then(r => r.ok ? r.text() : "").then(t => {
    grabCode = t;
    if (t) $("#bmLink").href = "javascript:" + encodeURIComponent(t.replace(/^\s*\/\/.*$/gm, ""));
  });
  $("#bmLink").addEventListener("click", e => { e.preventDefault(); impMsg("このリンクはブックマークバーにドラッグして、Discordのページで押してください。"); });
  $("#copyCode").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(grabCode); impMsg("コードをコピーしました。"); } catch (e) { impMsg("コピーできませんでした。"); }
  });
  impMsg();

  // ---------- events ----------
  $("#units").addEventListener("click", e => { const c = e.target.closest("[data-open]"); if (c) openSheet(c.dataset.open); });
  const put = (id, v) => { $(id).value = v ?? ""; };
  $("#restStart").innerHTML = Array.from({ length: 24 }, (_, h) => `<option value="${h}">${h}:00〜${(h + 7) % 24}:00</option>`).join("");
  put("#basis", S.basis); put("#judge", S.judge || "stage"); put("#margin", S.margin); put("#gap", gapSec()); put("#restStart", S.restStart); put("#busy", S.busy);
  $("#basis").addEventListener("change", e => { S.basis = e.target.value; save(); render(); });
  $("#judge").addEventListener("change", e => { S.judge = e.target.value; save(); render(); });
  $("#margin").addEventListener("change", e => { S.margin = num(e.target.value) || 0; save(); render(); });
  $("#gap").addEventListener("change", e => { const v = num(e.target.value); if (v != null && v >= 0) S.gap = v; put("#gap", gapSec()); save(); buildSongs(); render(); });
  const setLeft = (k, v) => { const now = Date.now(), lt = todayLeft(now), max = k === "skip" ? SKIP_DAY : AUTO_DAY;
    const x = num(v); if (x != null) lt[k] = Math.max(0, Math.min(max, Math.round(x)));
    S.left = Object.assign({ date: dkey(now) }, lt); save(); render(); };
  $("#skipLeft").addEventListener("change", e => setLeft("skip", e.target.value));
  $("#autoLeft").addEventListener("change", e => setLeft("auto", e.target.value));
  $("#restStart").addEventListener("change", e => { S.restStart = +e.target.value; save(); render(); });
  $("#busy").addEventListener("change", e => { S.busy = e.target.value; save(); render(); });
  $("#reload").addEventListener("click", load);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && (!loadedAt || Date.now() - loadedAt > 60000)) load(); });
  setInterval(() => { if (!document.hidden) load(); }, 3 * 60 * 1000);
  buildSongs();
  probeImages();
  load();
})();
</script>
</body>
</html>
